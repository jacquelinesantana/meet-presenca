<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meet Presença</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Meet Presença</h1>
        <p id="statusLine" class="status">Sem reunião ativa</p>
      </header>

      <section class="controls">
        <label for="meetingSelect">Reuniões salvas</label>
        <select id="meetingSelect"></select>
        <p id="startInfo" class="start-info">Início: -</p>
      </section>

      <section class="filter-section">
        <label for="minDwellInput">Tempo mínimo para presença:</label>
        <div class="filter-controls">
          <input type="number" id="minDwellInput" min="0" max="999" step="1" value="0" title="Participantes com menos tempo serão excluídos da tabela e exportações" />
          <span class="filter-unit">minutos</span>
          <span id="filterInfo" class="filter-info"></span>
        </div>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Tempo</th>
              <th>Sessões</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="participantsBody">
            <tr><td colspan="5" class="empty">Nenhum dado para exibir.</td></tr>
          </tbody>
        </table>
      </section>

      <section class="roster-section">
        <label for="rosterSelect">Arquivo de turma salvo:</label>
        <select id="rosterSelect"></select>
        <div class="roster-actions">
          <button id="btnImport" type="button">Subir novo arquivo</button>
          <button id="btnApplyRoster" type="button">Aplicar arquivo selecionado</button>
          <button id="btnDeleteRoster" type="button" class="danger">Excluir arquivo salvo</button>
        </div>
        <input id="fileInput" type="file" accept=".csv,.txt" hidden />
      </section>

      <section class="buttons">
        <button id="btnExportCsv" type="button">Exportar CSV</button>
        <button id="btnExportJson" type="button">Exportar JSON</button>
        <button id="btnOpenPanel" type="button">Abrir painel de participantes</button>
        <button id="btnClearMeeting" type="button" class="danger">Limpar reunião</button>
      </section>

      <p id="feedback" class="feedback" aria-live="polite"></p>

      <footer>
        <small>Os e-mails raramente aparecem no Meet. Importe a lista de convidados (Nome;E-mail) para completá-los.</small>
      </footer>
    </main>

    <script src="../lib/utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
